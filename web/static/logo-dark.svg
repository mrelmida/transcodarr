<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 80" width="560" height="80">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
    <linearGradient id="arrowGradFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:0.4"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <rect x="0" y="0" width="80" height="80" rx="16" fill="#1E293B"/>
  <path d="M 10 28 L 62 28" stroke="url(#arrowGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 54 20 L 64 28 L 54 36" fill="none" stroke="#F97316" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 70 52 L 18 52" stroke="url(#arrowGradFade)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 26 44 L 16 52 L 26 60" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <circle cx="40" cy="40" r="5" fill="#F97316"/>
  <circle cx="40" cy="40" r="9" fill="none" stroke="#F97316" stroke-width="1" opacity="0.3"/>

  <!-- Wordmark: TRANSCOD in white, ARR in orange -->
  <text x="96" y="52" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="42" font-weight="900" fill="#F8FAFC" letter-spacing="-1.5">TRANSCOD<tspan fill="#F97316">ARR</tspan></text>
</svg>
