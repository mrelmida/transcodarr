<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626"/>
      <stop offset="100%" style="stop-color:#EA580C"/>
    </linearGradient>
    <linearGradient id="arrowGradFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#EA580C;stop-opacity:0.35"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <rect x="0" y="0" width="90" height="90" rx="16" fill="#E2E8F0"/>
  <!-- Top arrow -->
  <path d="M 12 32 L 68 32" stroke="url(#arrowGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 60 24 L 70 32 L 60 40" fill="none" stroke="#EA580C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom arrow faded -->
  <path d="M 78 58 L 22 58" stroke="url(#arrowGradFade)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 30 50 L 20 58 L 30 66" fill="none" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <!-- Center dot -->
  <circle cx="45" cy="45" r="5" fill="#EA580C"/>
  <circle cx="45" cy="45" r="9" fill="none" stroke="#EA580C" stroke-width="1" opacity="0.25"/>

  <!-- Wordmark -->
  <text x="106" y="44" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="36" font-weight="900" fill="#0F172A" letter-spacing="-1">TRANSCO<tspan fill="#EA580C">DARR</tspan></text>
  <!-- Divider -->
  <line x1="108" y1="52" x2="415" y2="52" stroke="#EA580C" stroke-width="0.75" opacity="0.25"/>
  <!-- Tagline -->
  <text x="108" y="70" font-family="'Arial', Helvetica, sans-serif" font-size="12" font-weight="300" fill="#94A3B8" letter-spacing="2">TRANSCODING ORCHESTRATOR</text>
</svg>
